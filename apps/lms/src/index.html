<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Core Banking Academy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Applies the stored theme choice before the app boots, so the page never flashes the wrong
      look. ThemeStore (core/theme) owns it afterwards. Absence of a stored theme means "system"
      (the tokens' prefers-color-scheme rules handle it). Key: lms.theme.
      If a strict Content-Security-Policy is introduced, add this script's hash to script-src.
    -->
    <script>
      try {
        var theme = localStorage.getItem('lms.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
