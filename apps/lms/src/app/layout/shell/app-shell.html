@let chrome = store.chrome$(); @let user = store.user$();
<a class="skip-link" href="#main" (click)="skipToMain($event)"
  >Bỏ qua tới nội dung chính</a
>
<div
  class="app-shell"
  [class.app-shell--framed]="chrome === 'app'"
  [class.app-shell--rail]="store.sidebarCollapsed$()"
  [class.app-shell--fill]="store.fillsViewport$()"
  [class.app-shell--docked]="
    chrome === 'app' && chat.isDocked$() && !store.fillsViewport$()
  "
>
  @if (chrome === 'app' && user) {
  <app-sidebar
    class="app-shell__sidebar"
    [nav]="user.nav"
    [roleText]="store.roleText$()"
    [activePath]="store.path$()"
    [collapsible]="true"
    [collapsed]="store.sidebarCollapsed$()"
    (collapseToggle)="store.toggleSidebar()"
  />
  }
  <div class="app-shell__main">
    @if (chrome === 'app') {
    <app-header
      [navOpen]="store.navOpen$()"
      [user]="user"
      [unread]="store.unread$()"
      [levelName]="level.name$()"
      (menu)="store.openNav()"
      (searched)="store.search($event)"
      (picked)="store.pick($event)"
    />
    }
    <app-net-banner />
    <main
      id="main"
      class="app-shell__content"
      [class.app-shell__content--focus]="chrome === 'focus'"
      tabindex="-1"
    >
      <router-outlet
        (activate)="store.activated($event)"
        (deactivate)="store.deactivated()"
      />
    </main>
  </div>
</div>

@if (chrome === 'app' && user) {
<app-owl
  [besideToolbar]="devToolbar() !== null"
  [quiet]="store.fillsViewport$()"
/>
<app-upload-panel [besideToolbar]="devToolbar() !== null" />
@if (!store.fillsViewport$()) {
<app-chat-widget [besideToolbar]="devToolbar() !== null" />
} }

<ng-template
  [uiDrawer]="store.navOpen$()"
  uiDrawerTitle="Điều hướng chính"
  uiDrawerSide="start"
  (uiDrawerDismiss)="store.closeNav()"
>
  @if (user) {
  <app-sidebar
    [nav]="user.nav"
    [roleText]="store.roleText$()"
    [activePath]="store.path$()"
  />
  }
</ng-template>

@if (devToolbar(); as toolbar) {
<ng-container *ngComponentOutlet="toolbar" />
}
