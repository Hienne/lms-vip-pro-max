@let chrome = store.chrome$(); @let user = store.user$();
<a class="skip-link" href="#main" (click)="skipToMain($event)"
  >Bỏ qua tới nội dung chính</a
>
<div class="app-shell" [class.app-shell--framed]="chrome === 'app'">
  @if (chrome === 'app' && user) {
  <app-sidebar
    class="app-shell__sidebar"
    [menus]="user.menus"
    [roleText]="store.roleText$()"
    [activePath]="store.path$()"
    [inboxCount]="store.inboxCount$()"
  />
  }
  <div class="app-shell__main">
    @if (chrome === 'app') {
    <app-header
      [navOpen]="store.navOpen$()"
      [user]="user"
      [unread]="store.unread$()"
      (menu)="store.openNav(drawerBody)"
      (searched)="store.search($event)"
      (picked)="store.pick($event)"
    />
    }
    <app-net-banner />
    <main
      id="main"
      class="app-shell__content"
      [class.app-shell__content--focus]="chrome === 'focus'"
      tabindex="-1"
    >
      <router-outlet
        (activate)="store.activated($event)"
        (deactivate)="store.deactivated()"
      />
    </main>
  </div>
</div>

<ng-template #drawerBody>
  @if (user) {
  <app-sidebar
    [menus]="user.menus"
    [roleText]="store.roleText$()"
    [activePath]="store.path$()"
    [inboxCount]="store.inboxCount$()"
  />
  }
</ng-template>

@if (devToolbar(); as toolbar) {
<ng-container *ngComponentOutlet="toolbar" />
}
