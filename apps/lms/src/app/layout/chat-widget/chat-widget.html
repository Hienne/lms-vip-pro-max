@if (store.available$() && store.isOpen$()) {
<section
  class="chat"
  role="dialog"
  aria-modal="false"
  aria-label="Trợ lý nhanh"
  [id]="panelId"
  (keydown.escape)="dismiss()"
>
  <header class="chat__header">
    <app-owl-face class="chat__face" />
    @if (!isEmpty()) {
    <button
      uiIconButton
      size="sm"
      label="Xoá hội thoại"
      [disabled]="store.isAnswering$()"
      (click)="store.clear()"
    >
      <ui-icon name="trash-2" size="sm" />
    </button>
    }
    <button
      uiIconButton
      size="sm"
      class="chat__dock"
      [label]="store.isDocked$() ? 'Thu nhỏ' : 'Mở rộng'"
      (click)="store.toggleDocked()"
    >
      <ui-icon
        [name]="store.isDocked$() ? 'panel-right-close' : 'panel-right-open'"
        size="sm"
      />
    </button>
    <button uiIconButton size="sm" label="Đóng" (click)="dismiss()">
      <ui-icon name="x" size="sm" />
    </button>
  </header>
  <p class="sr-only" aria-live="polite">{{ store.announcement$() }}</p>
  <div
    #log
    class="chat__log"
    role="log"
    tabindex="0"
    aria-label="Hội thoại"
    (scroll)="trackScroll()"
  >
    @for (turn of store.turns$(); track turn.id) {
    <app-agent-message
      [turn]="turn"
      [busy]="store.isConfirming$()"
      (confirmed)="confirm($event)"
      (cancelled)="cancel($event)"
    />
    } @empty {
    <div class="chat__empty">
      <p class="chat__hint">
        Hỏi về tài liệu, mở một màn hình hoặc sửa hồ sơ của bạn. Thử:
      </p>
      <ul class="chat__suggestions">
        @for (suggestion of suggestions; track suggestion) {
        <li>
          <button
            type="button"
            class="chat__suggestion"
            [disabled]="store.isOffline$()"
            (click)="suggest(suggestion)"
          >
            {{ suggestion }}
          </button>
        </li>
        }
      </ul>
    </div>
    }
  </div>
  <div class="chat__composer">
    <app-agent-composer
      [answering]="store.isAnswering$()"
      [offline]="store.isOffline$()"
      (ask)="store.ask($event)"
      (stop)="store.stop()"
    />
  </div>
</section>
}
