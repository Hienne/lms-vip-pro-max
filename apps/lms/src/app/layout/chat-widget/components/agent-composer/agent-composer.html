<form class="composer" #formElement [formRoot]="composerForm">
  <label class="sr-only" for="agent-composer-box">Tin nhắn cho trợ lý</label>
  <div class="composer__field">
    <textarea
      uiTextarea
      #box
      id="agent-composer-box"
      class="composer__box"
      rows="1"
      autocomplete="off"
      [placeholder]="
        file() ? 'Bạn muốn tạo khóa học thế nào?' : 'Nhập câu hỏi…'
      "
      [formField]="composerForm.message"
      (keydown.enter)="send($event)"
    ></textarea>
    @if (answering()) {
    <button
      uiIconButton
      size="sm"
      class="composer__action"
      label="Dừng"
      (click)="stop.emit()"
    >
      <ui-icon name="square" size="sm" />
    </button>
    } @else {
    <button
      uiIconButton
      size="sm"
      class="composer__action composer__action--send"
      label="Gửi"
      [disabled]="!canSend() || tooLong()"
      (click)="submit()"
    >
      <ui-icon name="arrow-up" size="sm" />
    </button>
    }
  </div>
  @if (canAttach()) {
  <div class="composer__attach">
    <input
      #picker
      type="file"
      class="sr-only"
      tabindex="-1"
      [accept]="accept"
      (change)="pick($event)"
    />
    <button
      uiIconButton
      size="sm"
      label="Đính kèm tài liệu để tạo khóa học"
      [disabled]="answering() || offline()"
      (click)="picker.click()"
    >
      <ui-icon name="paperclip" size="sm" />
    </button>
    @if (file(); as attached) {
    <span class="composer__file">
      <span class="composer__file-name">{{ attached.name }}</span>
      <button
        uiIconButton
        size="sm"
        label="Bỏ tệp đính kèm"
        (click)="removeFile()"
      >
        <ui-icon name="x" size="sm" />
      </button>
    </span>
    }
  </div>
  @if (fileProblem(); as problem) {
  <p class="composer__note composer__note--error" role="alert">{{ problem }}</p>
  } } @if (offline()) {
  <p class="composer__note composer__note--error">Mất kết nối.</p>
  } @else if (counting()) {
  <p class="composer__note" [class.composer__note--error]="tooLong()">
    {{ length() }}/{{ limit }}
  </p>
  }
</form>
