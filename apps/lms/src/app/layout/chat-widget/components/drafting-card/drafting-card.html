@let state = card();
<div class="drafting-card">
  @if (note(); as text) {
  <p class="drafting-card__note">{{ text }}</p>
  } @if (confirmable()) {
  <button
    uiButton
    type="button"
    variant="primary"
    size="sm"
    [attr.aria-label]="'Đã chốt bước ' + state.step"
    (click)="confirmed.emit(state)"
  >
    Đã chốt
  </button>
  } @else if (state.state === 'failed') {
  <button
    uiButton
    type="button"
    variant="secondary"
    size="sm"
    [attr.aria-label]="'Mở trang soạn bước ' + state.step"
    (click)="opened.emit(state)"
  >
    Mở trang soạn
  </button>
  }
</div>
