<header class="header">
  <button
    uiIconButton
    class="header__menu"
    label="Mở menu điều hướng"
    aria-haspopup="dialog"
    [attr.aria-expanded]="navOpen()"
    (click)="menu.emit()"
  >
    <ui-icon name="menu" />
  </button>
  <button
    uiIconButton
    class="header__search-toggle"
    label="Tìm kiếm"
    aria-controls="header-search"
    [attr.aria-expanded]="searchOpen()"
    (click)="toggleSearch()"
  >
    <ui-icon [name]="searchOpen() ? 'x' : 'search'" />
  </button>
  <form
    id="header-search"
    class="header__search"
    [class.header__search--open]="searchOpen()"
    role="search"
    (submit)="submit($event)"
    (keydown.escape)="closeSearch()"
  >
    <ui-icon name="search" />
    <label class="sr-only" for="gsearch">Tìm kiếm</label>
    <input
      #q
      uiInput
      id="gsearch"
      name="q"
      type="search"
      autocomplete="off"
      [placeholder]="placeholder()"
    />
  </form>
  <div class="header__actions">
    <app-theme-picker />
    <app-notification-bell [unread]="unread()" />
    @if (user(); as me) {
    <ui-menu
      [label]="me.fullName"
      icon="user"
      variant="ghost"
      [iconOnly]="compact()"
      [entries]="entries()"
      (selected)="picked.emit($event)"
    />
    }
  </div>
</header>
