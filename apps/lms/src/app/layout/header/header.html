<header class="header">
  <button
    uiIconButton
    class="header__menu"
    label="Mở menu điều hướng"
    aria-haspopup="dialog"
    [attr.aria-expanded]="navOpen()"
    (click)="menu.emit()"
  >
    <ui-icon name="menu" />
  </button>
  <form class="header__search" role="search" (submit)="submit($event)">
    <ui-icon name="search" />
    <label class="sr-only" for="gsearch">Tìm kiếm</label>
    <input
      #q
      uiInput
      id="gsearch"
      name="q"
      type="search"
      autocomplete="off"
      [placeholder]="placeholder()"
    />
  </form>
  <div class="header__actions">
    <a
      uiIconButton
      routerLink="/notifications"
      [dot]="unread() > 0"
      [label]="bellLabel()"
    >
      <ui-icon name="bell" />
    </a>
    @if (user(); as me) {
    <ui-menu
      [label]="me.name"
      icon="user"
      variant="ghost"
      [entries]="entries()"
      (selected)="picked.emit($event)"
    />
    }
  </div>
</header>
