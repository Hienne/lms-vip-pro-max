<div class="route-placeholder">
  <h2 class="route-placeholder__title">{{ title }}</h2>
  <p class="route-placeholder__text">
    Chức năng này đang được hoàn thiện và sẽ có trong bản cập nhật tới.
  </p>
  <div class="route-placeholder__actions">
    <a uiButton variant="secondary" [routerLink]="homePath()">Về trang chủ</a>
  </div>
  @if (showBoard) {
  <p class="route-placeholder__dev">
    <a routerLink="/dev/migration">Xem tiến độ migrate</a>
  </p>
  }
</div>
