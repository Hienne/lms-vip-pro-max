<ng-template #note let-kpi>
  @if (kpi.verdict) {
  <span [class.learn-kpis__fail]="kpi.failed">{{ kpi.verdict }}</span>
  @if (kpi.detail) { · } } {{ kpi.detail }} @if (kpi.overdue !== undefined) { ·
  <span [class.learn-kpis__fail]="kpi.overdue > 0">
    {{ kpi.overdue }} quá hạn
  </span>
  }
</ng-template>

<ui-stat-strip>
  <ui-stat
    [label]="assigned().label"
    [value]="assigned().shown"
    link="/catalog"
    [queryParams]="assigned().query ?? undefined"
  >
    <span slot="note">
      <ng-container
        *ngTemplateOutlet="note; context: { $implicit: assigned() }"
      />
    </span>
  </ui-stat>

  @if (dashboardFailed()) {
  <ui-stat [label]="completion().label" value="—" note="Không tải được">
    <button uiButton variant="ghost" size="sm" (click)="retryDashboard.emit()">
      Thử lại
    </button>
  </ui-stat>
  } @else {
  <ui-stat
    [label]="completion().label"
    [value]="completion().shown"
    [unit]="completion().value !== null ? '%' : undefined"
    [attr.aria-busy]="!dashboard()"
  >
    <span slot="note">
      <ng-container
        *ngTemplateOutlet="note; context: { $implicit: completion() }"
      />
    </span>
  </ui-stat>
  } @for (kpi of scores(); track kpi.label) {
  <ui-stat
    [label]="kpi.label"
    [value]="kpi.shown"
    [unit]="kpi.value !== null ? '%' : undefined"
    [link]="kpi.href ?? undefined"
    [attr.title]="kpi.title"
  >
    <span slot="note">
      <ng-container *ngTemplateOutlet="note; context: { $implicit: kpi }" />
    </span>
  </ui-stat>
  }
</ui-stat-strip>
