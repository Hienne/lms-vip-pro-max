<main class="change-password">
  <div class="change-password__card">
    <ui-mai [size]="36" />
    <div class="change-password__intro">
      <h1 class="change-password__title">Đổi mật khẩu</h1>
      @if (user(); as me) {
      <p class="change-password__help">
        Tài khoản <strong>{{ me.fullName }}</strong> ({{ me.username }})
      </p>
      }
    </div>
    @if (forced()) {
    <ui-alert tone="warning" heading="Bạn đang dùng mật khẩu tạm"
      >Hãy đặt mật khẩu mới trước khi vào hệ thống. Sau khi đổi, bạn đăng nhập
      lại bằng mật khẩu mới.</ui-alert
    >
    }
    <app-password-form
      [busy]="store.isChanging$()"
      (submitted)="store.change($event)"
    />
    <button uiButton variant="ghost" type="button" (click)="signOut()">
      <ui-icon name="log-out" size="sm" />Đăng xuất
    </button>
  </div>
</main>
