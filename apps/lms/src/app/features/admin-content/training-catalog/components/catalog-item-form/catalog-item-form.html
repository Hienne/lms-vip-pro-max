<form id="catalog-item-form" class="stack" [formRoot]="itemForm">
  <ui-field
    label="Mã"
    required
    [hint]="kind() === 'field' ? 'Ví dụ: NV, VH' : 'Ví dụ: VH-02'"
  >
    <input uiInput [formField]="itemForm.code" />
  </ui-field>
  <ui-field label="Tên" required>
    <input uiInput [formField]="itemForm.name" />
  </ui-field>
  <ui-field label="Mô tả">
    <textarea uiTextarea rows="3" [formField]="itemForm.description"></textarea>
  </ui-field>
</form>
