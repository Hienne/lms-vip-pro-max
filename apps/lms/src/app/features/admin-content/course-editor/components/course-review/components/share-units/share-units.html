<section uiCard>
  <div uiCardBody class="stack">
    <h2 class="share-units__title">Chia sẻ cho đơn vị khác</h2>
    <p class="share-units__help">
      Đơn vị được chia sẻ có thể giao khóa cho học viên của mình nhưng không sửa
      nội dung.
    </p>
    @if (store.sharesError$(); as error) {
    <p class="share-units__error" role="alert">{{ error.message }}</p>
    } @else {
    <ui-multi-select
      label="Đơn vị được chia sẻ"
      [options]="options()"
      [value]="selected()"
      placeholder="Chọn đơn vị được chia sẻ"
      (valueChange)="select($event)"
    />
    @for (unit of store.shareUnits$(); track unit.orgId) { @if (unit.error) {
    <p class="share-units__message" role="alert">
      {{ unit.name }}: {{ unit.error }}
    </p>
    } } }
  </div>
</section>
