<form class="flow-step-form" novalidate (submit)="save($event)">
  @if (fresh()) {
  <p class="flow-step-form__hint">
    Bước mới vừa nối. Đặt tiêu đề và mô tả cho bước này.
  </p>
  }
  <div class="flow-step-form__pair">
    <ui-field label="Từ">
      <select uiSelect [formField]="stepForm.from">
        @for (object of objects(); track object.id) {
        <option [value]="object.id">{{ object.name }}</option>
        }
      </select>
    </ui-field>
    <ui-field label="Đến">
      <select uiSelect [formField]="stepForm.to">
        <option value="">— Tự xử lý —</option>
        @for (object of objects(); track object.id) {
        <option [value]="object.id">{{ object.name }}</option>
        }
      </select>
    </ui-field>
  </div>
  <ui-field label="Tiêu đề bước">
    <input uiInput [formField]="stepForm.title" #title />
  </ui-field>
  <ui-field label="Mô tả (không bắt buộc)">
    <textarea uiTextarea rows="3" [formField]="stepForm.description"></textarea>
  </ui-field>
  <div class="flow-step-form__actions">
    <button uiButton variant="primary" size="sm" type="submit">Lưu bước</button>
    <button
      uiButton
      variant="ghost"
      size="sm"
      type="button"
      (click)="cancelled.emit()"
    >
      {{ fresh() ? 'Bỏ bước này' : 'Hủy' }}
    </button>
  </div>
</form>
