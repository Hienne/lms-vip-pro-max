<ui-breadcrumb
  [items]="[
    { label: 'Khóa học', href: '/admin/courses' },
    { label: 'Tạo khóa học mới' },
  ]"
/>
<ui-page-header
  title="Tạo khóa học mới"
  description="Đặt mã và tên để tạo bản nháp. Chương trình, nội dung và điều kiện hoàn thành soạn ở bước sau."
/>

<section uiCard>
  <form uiCardBody class="stack" [formRoot]="courseForm">
    @if (store.createError$(); as error) {
    <ui-alert tone="danger">
      {{ error.title ? error.title + ': ' : '' }}{{ error.message }}
    </ui-alert>
    }
    <ui-field label="Tên khóa học" required>
      <input
        uiInput
        [formField]="courseForm.title"
        placeholder="Ví dụ: Quy trình đối soát cuối ngày"
      />
    </ui-field>
    <ui-field
      label="Mã khóa học"
      required
      hint="Duy nhất trong hệ thống, không đổi sau khi tạo. Ví dụ: VH-302."
    >
      <input uiInput [formField]="courseForm.code" />
    </ui-field>
    @if (store.orgName$(); as org) {
    <p class="course-new__owner">Đơn vị sở hữu: {{ org }}</p>
    }
    <div class="course-new__actions">
      <a uiButton variant="ghost" routerLink="/admin/courses">Hủy</a>
      <button
        uiButton
        variant="primary"
        type="submit"
        [disabled]="store.isCreating$()"
      >
        Tạo và soạn nội dung
      </button>
    </div>
  </form>
</section>
