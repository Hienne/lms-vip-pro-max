<ui-field [label]="label()" [required]="required()" [hint]="hint()">
  <select
    uiSelect
    [disabled]="disabled() || busy()"
    (change)="choose(dropdown.value)"
    #dropdown
  >
    <option value="" [selected]="!selected()">{{ emptyLabel() }}</option>
    @for (option of items(); track option.id) {
    <option [value]="option.id" [selected]="option.id === selected()?.id">
      {{ optionLabel(option) }}
    </option>
    }
  </select>
</ui-field>
@if (error()) {
<button
  uiButton
  variant="ghost"
  size="sm"
  type="button"
  [attr.aria-label]="'Bỏ lựa chọn ' + label()"
  (click)="choose('')"
>
  Bỏ lựa chọn
</button>
} @if (loadFailed()) {
<button
  uiButton
  variant="ghost"
  size="sm"
  type="button"
  [attr.aria-label]="'Tải lại ' + label()"
  (click)="retried.emit()"
>
  Tải lại
</button>
}
