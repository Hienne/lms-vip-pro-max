<nav aria-label="Mục lục khóa học">
  <ui-tree
    label="Mục lục khóa học"
    wrapLabels
    [nodes]="nodes()"
    [trailing]="trailing"
    [(expanded)]="expanded"
    [selected]="selectedId()"
    (selectedChange)="open($event)"
  />
</nav>

<ng-template #trailing let-node>
  @if (node.data.state; as state) {
  <app-lesson-status class="toc__state" [state]="state" />
  } @else if (node.data.kind === 'final') {
  <span class="toc__sr">Cần đạt để hoàn thành khóa học</span>
  }
</ng-template>
