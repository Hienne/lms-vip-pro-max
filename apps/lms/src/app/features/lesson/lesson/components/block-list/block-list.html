<div class="blocks">
  <label class="blocks__position" for="lesson-block-select"
    >Khối {{ position() }}/{{ blocks().length }}</label
  >
  <select
    uiSelect
    id="lesson-block-select"
    class="blocks__select"
    (change)="choose($event)"
  >
    @for (block of blocks(); track block.id) {
    <option [value]="block.id" [selected]="block.id === activeId()">
      {{ block.title }} · {{ typeLabel[block.detail.block.blockType] }} @switch
      (block.status) { @case ('completed') { · Đã hoàn thành } @case
      ('in_progress') { · {{ block.percent }}% } }
    </option>
    }
  </select>
</div>
