<ul class="chapters" aria-label="Mốc nội dung video">
  @for (chapter of chapters(); track $index) {
  <li>
    <button
      uiChip
      class="chapters__item"
      [attr.aria-current]="$index === current() ? 'true' : null"
      (click)="seek.emit(chapter.startSeconds)"
    >
      {{ clock(chapter.startSeconds) }} · {{ chapter.title }}
    </button>
  </li>
  }
</ul>
