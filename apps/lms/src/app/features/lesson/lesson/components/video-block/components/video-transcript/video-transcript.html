<details class="transcript">
  <summary class="transcript__summary">
    <ui-icon name="chevron-down" size="sm" class="transcript__chevron" />
    Lời thoại ({{ lines().length }} đoạn)
  </summary>
  <div class="transcript__body">
    <input
      uiInput
      size="sm"
      type="search"
      class="transcript__search"
      aria-label="Tìm trong lời thoại"
      placeholder="Tìm trong lời thoại"
      [formField]="searchForm.query"
    />
    @if (shown().length) {
    <ol class="transcript__lines">
      @for (item of shown(); track item.index) {
      <li>
        <div
          class="transcript__line"
          [attr.aria-current]="item.playing ? 'true' : null"
        >
          @if (item.line.startSeconds !== null) {
          <span class="transcript__time"
            >{{ clock(item.line.startSeconds) }}</span
          >{{ ' ' }}}<span class="transcript__text">{{ item.line.text }}</span>
        </div>
      </li>
      }
    </ol>
    } @else {
    <p class="transcript__empty">Không có đoạn nào khớp.</p>
    }
  </div>
</details>
