@if (failed()) {
<p class="video__error">
  Không phát được video.
  <button uiButton variant="ghost" size="sm" (click)="retried()">
    Thử lại
  </button>
</p>
} @else {
<video
  #player
  class="video__player"
  controls
  preload="metadata"
  [src]="src()"
  [attr.aria-label]="title() || null"
  (loadedmetadata)="loaded()"
  (play)="play()"
  (pause)="pause()"
  (seeking)="seeking()"
  (timeupdate)="tick()"
  (error)="failed.set(true)"
></video>
<button
  uiButton
  size="sm"
  class="video__bookmark"
  [variant]="bookmarked() ? 'secondary' : 'ghost'"
  [attr.aria-pressed]="bookmarked()"
  [disabled]="busy()"
  (click)="bookmarkHere()"
>
  <ui-icon name="bookmark" size="sm" />
  Đánh dấu mốc {{ clock(second()) }}
</button>
@if (chapters().length) {
<app-video-chapters
  class="video__chapters"
  [chapters]="chapters()"
  [second]="second()"
  (seek)="seekTo($event)"
/>
} }
