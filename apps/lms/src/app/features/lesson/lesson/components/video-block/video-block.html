@if (failed()) {
<p class="video__error">
  Không phát được video.
  <button uiButton variant="ghost" size="sm" (click)="retried()">
    Thử lại
  </button>
</p>
} @else {
<div #stage class="video__stage">
  <video
    #player
    class="video__player"
    playsinline
    disablePictureInPicture
    disableRemotePlayback
    preload="metadata"
    [src]="src()"
    [attr.aria-label]="title() || null"
    (loadstart)="loadStarted()"
    (loadedmetadata)="loaded()"
    (play)="play()"
    (pause)="pause()"
    (ended)="ended()"
    (seeking)="seeking()"
    (timeupdate)="tick()"
    (volumechange)="volumeChanged()"
    (contextmenu)="$event.preventDefault()"
    (error)="loadFailed()"
  ></video>
  <div class="video__controls">
    <button
      uiIconButton
      type="button"
      size="sm"
      [label]="playing() ? 'Tạm dừng video' : 'Phát video'"
      (click)="togglePlayback()"
    >
      <ui-icon [name]="playing() ? 'pause' : 'play'" />
    </button>
    <span class="video__time" aria-label="Thời gian đã phát"
      >{{ clock(second()) }} / {{ clock(duration()) }}</span
    >
    <button
      uiIconButton
      type="button"
      size="sm"
      [label]="muted() ? 'Bật âm thanh' : 'Tắt âm thanh'"
      (click)="toggleMute()"
    >
      <ui-icon [name]="muted() ? 'volume-x' : 'volume-2'" />
    </button>
    @if (fullscreenAvailable) {
    <button
      uiIconButton
      type="button"
      size="sm"
      [label]="fullscreen() ? 'Thoát toàn màn hình video' : 'Toàn màn hình video'"
      (click)="toggleFullscreen()"
    >
      <ui-icon name="maximize" />
    </button>
    }
  </div>
</div>
<button
  uiButton
  size="sm"
  class="video__bookmark"
  [variant]="bookmarked() ? 'secondary' : 'ghost'"
  [attr.aria-pressed]="bookmarked()"
  [disabled]="busy()"
  (click)="bookmarkHere()"
>
  <ui-icon name="bookmark" size="sm" />
  Đánh dấu mốc {{ clock(second()) }}
</button>
@if (chapters().length) {
<app-video-chapters
  class="video__chapters"
  [chapters]="chapters()"
  [second]="second()"
/>
} @if (transcript().length) {
<app-video-transcript
  class="video__transcript"
  [lines]="transcript()"
  [second]="second()"
/>
} }
