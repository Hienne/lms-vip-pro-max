@if (store.isMissing$()) {
<ui-empty
  variant="page"
  [headingLevel]="1"
  title="Không tìm thấy chứng nhận"
  description="Chứng nhận không tồn tại hoặc bạn chưa hoàn thành khóa học."
>
  <a uiButton variant="primary" routerLink="/certificates"
    >Về danh sách chứng nhận</a
  >
</ui-empty>
} @else if (store.error$(); as error) {
<ui-error-state
  title="Không tải được chứng nhận"
  [message]="error.message"
  (retry)="store.retry()"
/>
} @else if (store.document$(); as doc) {
<ui-page-header [title]="doc.title">
  <ui-breadcrumb slot="breadcrumb" [items]="crumbs()" />
  <div slot="actions">
    <button uiButton variant="primary" type="button" (click)="print()">
      <ui-icon name="printer" />In / Lưu PDF
    </button>
  </div>
</ui-page-header>

<app-certificate-sheet [document]="doc" />
} @else {
<div
  uiSkeleton
  variant="block"
  class="certificate__placeholder"
  role="status"
  aria-label="Đang tải chứng nhận"
></div>
}
