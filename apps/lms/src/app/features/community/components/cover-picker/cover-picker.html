<app-content-thumbnail
  class="cover-picker__preview"
  [kind]="kind()"
  [contentId]="contentId()"
  [revisionAssetId]="revisionAssetId()"
  [preview]="preview()"
/>
<div class="cover-picker__fields">
  <span class="cover-picker__label">Ảnh bìa</span>
  <p class="cover-picker__hint">
    JPG, PNG hoặc WebP, tối đa 5 MB. Nên dùng ảnh ngang 16:9. Không chọn ảnh sẽ
    dùng ảnh mặc định.
  </p>
  <div class="cover-picker__actions">
    <button
      uiButton
      type="button"
      [disabled]="disabled()"
      (click)="coverFile.click()"
    >
      {{ hasCover() ? 'Đổi ảnh' : 'Chọn ảnh' }}
    </button>
    @if (hasCover()) {
    <button
      uiButton
      variant="ghost"
      type="button"
      [disabled]="disabled()"
      (click)="removed.emit()"
    >
      Dùng ảnh mặc định
    </button>
    }
  </div>
  <input
    #coverFile
    type="file"
    accept="image/jpeg,image/png,image/webp"
    hidden
    (change)="choose(coverFile)"
  />
  @if (uploading()) {
  <p role="status" class="cover-picker__hint">Đang tải và kiểm tra ảnh…</p>
  } @if (error(); as message) {
  <p role="alert" class="cover-picker__error">{{ message }}</p>
  }
</div>
