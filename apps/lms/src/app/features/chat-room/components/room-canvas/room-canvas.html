<div
  class="room-canvas"
  tabindex="0"
  role="application"
  aria-label="Phòng học. Dùng WASD hoặc phím mũi tên để di chuyển, Enter để chat."
  (pointerdown)="focus($event)"
>
  <div #mount class="room-canvas__mount"></div>
  @if (view().online) { @if (gesturesEnabled()) {
  <div class="room-canvas__gestures">
    <div class="row row--gap-1" role="group" aria-label="Động tác nhân vật">
      <button
        uiButton
        size="sm"
        [disabled]="view().chatting"
        (click)="performGesture('jump', $event)"
      >
        Nhảy
      </button>
      <button
        uiButton
        size="sm"
        [disabled]="view().chatting"
        (click)="performGesture('wave', $event)"
      >
        Vẫy chào
      </button>
    </div>
  </div>
  <p
    class="room-canvas__gesture-notice"
    [class.room-canvas__gesture-notice--active]="gestureNotice()"
    role="status"
  >
    {{ gestureNotice() }}
  </p>
  } @if (mode() === '3d') {
  <button
    uiButton
    size="sm"
    class="room-canvas__portrait"
    [attr.aria-pressed]="portrait()"
    (click)="togglePortrait()"
  >
    Cận cảnh nhân vật
  </button>
  }
  <div class="room-canvas__controls" aria-label="Điều khiển cảm ứng">
    <button
      uiButton
      size="sm"
      aria-label="Đi lên"
      (pointerdown)="touch($event, 0, -1)"
      (pointerup)="stopTouch()"
      (pointercancel)="stopTouch()"
      (lostpointercapture)="stopTouch()"
    >
      ↑
    </button>
    <div>
      <button
        uiButton
        size="sm"
        aria-label="Đi trái"
        (pointerdown)="touch($event, -1, 0)"
        (pointerup)="stopTouch()"
        (pointercancel)="stopTouch()"
        (lostpointercapture)="stopTouch()"
      >
        ←
      </button>
      <button
        uiButton
        size="sm"
        aria-label="Đi xuống"
        (pointerdown)="touch($event, 0, 1)"
        (pointerup)="stopTouch()"
        (pointercancel)="stopTouch()"
        (lostpointercapture)="stopTouch()"
      >
        ↓
      </button>
      <button
        uiButton
        size="sm"
        aria-label="Đi phải"
        (pointerdown)="touch($event, 1, 0)"
        (pointerup)="stopTouch()"
        (pointercancel)="stopTouch()"
        (lostpointercapture)="stopTouch()"
      >
        →
      </button>
    </div>
  </div>
  }
</div>
