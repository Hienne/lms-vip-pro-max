@if (store.historyBeside$()) {
<aside
  id="assistant-history"
  class="history"
  aria-labelledby="assistant-history-title"
>
  <header class="history__bar">
    <h2 id="assistant-history-title" class="history__title">Hội thoại</h2>
  </header>
  <div class="history__body">
    <ng-container [ngTemplateOutlet]="conversations" />
  </div>
</aside>
}

<section class="chat" aria-labelledby="assistant-title">
  <header class="chat__bar">
    <div class="chat__heading">
      <button
        uiButton
        type="button"
        variant="ghost"
        size="sm"
        class="chat__toggle"
        [attr.aria-controls]="store.historyOpen$() ? 'assistant-history' : null"
        [attr.aria-expanded]="store.historyOpen$()"
        (click)="store.toggleHistory()"
      >
        <ui-icon name="history" size="sm" />Hội thoại
      </button>
      <h1 id="assistant-title" class="chat__title">
        Trợ lý AI tra cứu tài liệu
      </h1>
    </div>
    <button
      uiButton
      type="button"
      variant="ghost"
      size="sm"
      class="chat__toggle"
      [attr.aria-controls]="store.panelOpen$() ? 'assistant-documents' : null"
      [attr.aria-expanded]="store.panelOpen$()"
      (click)="store.togglePanel()"
    >
      <ui-icon name="panel-right" size="sm" />Tài liệu
      <span class="chat__count">{{ store.totalDocuments$() }}</span>
    </button>
  </header>
  <div class="chat__scroll">
    <app-chat-log
      class="chat__thread"
      [turns]="store.turns$()"
      [ratingId]="store.ratingId$()"
      [ratingFailedId]="store.ratingFailedId$()"
      (retry)="store.retry($event)"
      (asked)="store.ask($event)"
      (rated)="store.rate($event.turnId, $event.command)"
    />
  </div>
  <div class="chat__composer">
    <div class="chat__dock">
      <app-ask-form
        [answering]="store.isAnswering$()"
        (ask)="store.ask($event)"
        (stop)="store.stop()"
      />
      <p class="chat__note">
        Trợ lý chỉ trả lời từ các tài liệu trong kho. Hãy đối chiếu với tài liệu
        gốc trước khi áp dụng.
      </p>
    </div>
  </div>
</section>

@if (store.panelBeside$()) {
<aside
  id="assistant-documents"
  class="panel"
  aria-labelledby="assistant-documents-title"
>
  <header class="panel__bar">
    <h2 id="assistant-documents-title" class="panel__title">
      Tài liệu trong kho
    </h2>
    <span class="panel__count">{{ store.totalDocuments$() }}</span>
  </header>
  <div class="panel__body">
    <ng-container [ngTemplateOutlet]="documents" />
  </div>
</aside>
}

<ng-template
  [uiDrawer]="store.panelInDrawer$()"
  uiDrawerTitle="Tài liệu trong kho"
  (uiDrawerDismiss)="store.closePanel()"
>
  <div id="assistant-documents" class="panel__drawer">
    <ng-container [ngTemplateOutlet]="documents" />
  </div>
</ng-template>

<ng-template
  [uiDrawer]="store.historyInDrawer$()"
  uiDrawerTitle="Hội thoại"
  (uiDrawerDismiss)="store.closeHistory()"
>
  <div id="assistant-history" class="history__drawer">
    <ng-container [ngTemplateOutlet]="conversations" />
  </div>
</ng-template>

<ng-template #conversations>
  <app-conversation-list
    [items]="history.items$()"
    [activeId]="store.conversationId$()"
    [loading]="history.isLoading$()"
    [failed]="!!history.loadError$()"
    [searching]="history.query$() !== ''"
    [openError]="store.openError$()"
    [busy]="store.isAnswering$() || store.isOpening$() || history.isChanging$()"
    (searched)="history.setQuery($event)"
    (created)="store.newConversation()"
    (opened)="store.openConversation($event)"
    (renamed)="history.rename($event.id, $event.title)"
    (removed)="history.remove($event)"
    (removedAll)="history.removeAll()"
    (retried)="history.retryLoad()"
  />
</ng-template>

<ng-template #documents>
  <app-document-upload
    [uploads]="store.uploads$()"
    [canShareGlobally]="store.canShareGlobally$()"
    [scope]="store.uploadScope$()"
    (scopeChange)="store.setUploadScope($event)"
    [title]="store.uploadTitle$()"
    (titleChange)="store.setUploadTitle($event)"
    (files)="store.addFiles($event)"
    (dismiss)="store.dismissUpload($event)"
    (showExisting)="store.showDocument($event)"
  />
  <app-document-list
    [documents]="store.documents$()"
    [total]="store.totalDocuments$()"
    [page]="store.page$()"
    [pageSize]="pageSize"
    [loading]="store.isLoading$()"
    [failed]="!!store.loadError$()"
    [canRemove]="store.canRemove"
    [canEdit]="store.canEdit"
    [highlightId]="store.highlightId$()"
    (remove)="store.removeDocument($event)"
    (renamed)="store.renameDocument($event.document, $event.title)"
    (replaced)="store.replaceDocument($event.document, $event.file)"
    (pageChange)="store.setPage($event)"
    (retry)="store.retryLoad()"
  />
  <app-duplicate-documents
    [groups]="store.duplicates$()"
    (remove)="store.removeDocument($event)"
  />
</ng-template>
<p class="sr-only" role="status">{{ store.announcement$() }}</p>
