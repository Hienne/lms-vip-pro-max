<button
  uiBadge
  outline
  type="button"
  class="source"
  [attr.aria-label]="name()"
  [uiTooltip]="details"
  uiTooltipToggle
>
  {{ citation().n }}
</button>
<ng-template #details>
  <span class="source__file">{{ citation().fileName }}</span>
  <span class="source__where">{{ location() }}</span>
  <span class="source__quote">{{ citation().snippet }}</span>
</ng-template>
