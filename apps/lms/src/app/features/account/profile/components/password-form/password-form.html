<form class="password-form" novalidate (submit)="onSubmit($event)">
  <ui-field label="Mật khẩu hiện tại" required [errors]="curErrors()">
    <input
      uiInput
      type="password"
      autocomplete="current-password"
      [formField]="passwordForm.cur"
    />
  </ui-field>
  <div class="password-form__gap" aria-hidden="true"></div>
  <ui-field
    label="Mật khẩu mới"
    required
    hint="Tối thiểu 8 ký tự, có chữ hoa và chữ số."
    [errors]="nextErrors()"
  >
    <input
      uiInput
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.next"
    />
  </ui-field>
  <ui-field label="Nhập lại mật khẩu mới" required [errors]="confirmErrors()">
    <input
      uiInput
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.confirm"
    />
  </ui-field>
  <div class="password-form__actions">
    <button uiButton variant="secondary" type="submit" [disabled]="busy()">
      Đổi mật khẩu
    </button>
  </div>
</form>
