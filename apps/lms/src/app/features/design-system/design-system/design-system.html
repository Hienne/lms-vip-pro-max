<a class="skip-link" [routerLink]="[]" [fragment]="mainId" (click)="focusMain()"
  >Bỏ qua tới nội dung chính</a
>

<div class="layout">
  <nav class="toc" aria-label="Mục lục Design System">
    <div class="toc__brand">
      <ui-mai [size]="28" />
      <strong>Design System v2</strong>
    </div>
    <ol class="toc__list">
      @for (item of tocItems; track item.id) {
      <li>
        <a
          class="toc__link"
          [routerLink]="[]"
          [fragment]="item.domId"
          (click)="focusHeading(item.id)"
        >
          <span class="toc__number">{{ item.number }}</span>
          {{ item.tocLabel }}
        </a>
      </li>
      }
    </ol>
    <div class="toc__theme">
      <app-theme-controls />
    </div>
  </nav>

  <main class="layout__main" [id]="mainId" tabindex="-1">
    <ui-page-header
      title="Design System"
      description="Teal BIDV cho hệ thống và hành động, vàng hoa mai chỉ cho thành tích. Mọi component trên trang này là component thật của ứng dụng, đọc token từ _tokens.scss."
    />
    <app-principles-section />
    <app-color-section />
    <app-type-section />
    <app-space-section />
    <app-icons-section />
    <app-buttons-section />
    <app-forms-section />
    <app-status-section />
    <app-data-section />
    <app-nav-section />
    <app-feedback-section />
    <app-learning-section />
    <app-charts-section />
  </main>
</div>
