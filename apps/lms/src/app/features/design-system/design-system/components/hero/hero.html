<header class="hero">
  <div class="hero__mai" aria-hidden="true">
    <ui-mai [size]="360" petal="white" core="white" />
  </div>
  <div class="hero__main">
    <h1 class="hero__title">
      Flat, rõ ràng, đáng tin cậy — và dễ chuyển thành code.
    </h1>
    <p class="hero__lead">
      Teal BIDV cho hệ thống &amp; hành động, vàng hoa mai chỉ cho thành tích.
      Mọi component trên trang này là component thật của ứng dụng, đọc token từ
      <code class="hero__code">_tokens.scss</code>.
    </p>
    <ul class="hero__highlights">
      @for (highlight of highlights; track highlight) {
      <li class="hero__chip">
        <ui-icon name="check" size="sm" />{{ highlight }}
      </li>
      }
    </ul>
  </div>
</header>
