<div
  class="demo"
  [class.demo--dashed]="frame() === 'dashed'"
  [class.demo--card]="frame() === 'card'"
>
  @if (label()) {
  <span class="demo__label">{{ label() }}</span>
  } @if (pending().length === 0) {
  <ng-content />
  } @else {
  <div class="demo__pending" role="note" data-placeholder>
    <strong>Chưa migrate</strong>
    <ul class="demo__pending-list">
      @for (item of pending(); track item.id) {
      <li>
        <code>{{ item.id }}</code> · {{ item.status }} @if (showDetails) { @if
        (item.owner) { · &#64;{{ item.owner }} } @if (item.pullRequest) { ·
        <a [href]="item.pullRequest">Pull request</a>
        } }
      </li>
      }
    </ul>
  </div>
  }
</div>
