<div class="row">
  <ui-menu
    label="Menu"
    icon="ellipsis"
    [entries]="store.entries"
    (selected)="store.choose($event)"
  />
  <ui-menu
    label="Thao tác khóa học"
    iconOnly
    [entries]="store.entries"
    (selected)="store.choose($event)"
  />
  <span class="menu-demo__status" aria-live="polite">
    @if (store.chosenLabel$(); as label) { Đã chọn: {{ label }} } @else { Chưa
    chọn thao tác nào. }
  </span>
</div>
<p class="menu-demo__note">
  Phím mũi tên, Home/End, gõ chữ cái để nhảy, Enter chọn, Esc để đóng và trả
  focus về nút mở.
</p>
