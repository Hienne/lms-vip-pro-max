<div class="row">
  <button uiButton (click)="store.confirmPublish()">
    <ui-icon name="circle-help" size="sm" /> Hộp xác nhận
  </button>
  <button uiButton variant="danger-ghost" (click)="store.confirmDelete()">
    <ui-icon name="trash-2" size="sm" /> Xác nhận xóa
  </button>
</div>
<p class="confirm-demo__note">Bẫy focus, Esc để đóng, trả focus về nút mở.</p>
@if (store.result$()) {
<p class="confirm-demo__result" role="status">
  Kết quả: <strong>{{ store.result$() }}</strong>
</p>
}
