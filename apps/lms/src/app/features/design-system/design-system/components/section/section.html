<section class="stack" [id]="domId()" [attr.aria-labelledby]="headingId()">
  <div>
    <span class="ds-section__number">{{ number() }}</span>
    <h2 class="ds-section__title" [id]="headingId()" tabindex="-1">
      {{ title() }}
    </h2>
    @if (description()) {
    <p class="ds-section__description">{{ description() }}</p>
    }
  </div>
  <ng-content />
</section>
