<section
  class="flex flex-col gap-4"
  [id]="domId()"
  [attr.aria-labelledby]="headingId()"
>
  <div>
    <span class="text-xs font-semibold tracking-wider text-text-muted uppercase"
      >{{ number() }}</span
    >
    <h2 class="text-2xl" [id]="headingId()" tabindex="-1">{{ title() }}</h2>
    @if (description()) {
    <p class="mt-2 text-text-secondary">{{ description() }}</p>
    }
  </div>
  <ng-content />
</section>
