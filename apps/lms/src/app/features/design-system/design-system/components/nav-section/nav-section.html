<app-ds-section section="nav" title="Điều hướng">
  <app-ds-demo label="Breadcrumb" [needs]="['breadcrumb']">
    <ui-breadcrumb [items]="trail" />
  </app-ds-demo>
  <app-ds-demo label="Page header" [needs]="['page-header']">
    <ui-page-header
      eyebrow="Khóa học"
      title="Nền tảng nghiệp vụ Core Banking"
      description="Lộ trình nền tảng cho nhân sự mới của Ban QL&PT Core Banking."
    >
      <ui-breadcrumb slot="breadcrumb" [items]="trail" />
      <button slot="actions" type="button" uiButton>Chia sẻ</button>
      <button slot="actions" type="button" uiButton variant="primary">
        Tiếp tục học
      </button>
    </ui-page-header>
  </app-ds-demo>
  <app-ds-demo label="Tabs (← → để chuyển)" [needs]="['tabs']"></app-ds-demo>
  <app-ds-demo label="Segmented" [needs]="['segmented']">
    <div>
      <ui-segmented
        label="Kỳ"
        [options]="periods"
        [value]="store.period$()"
        (valueChange)="store.setPeriod($event)"
      />
    </div>
  </app-ds-demo>
  <app-ds-demo label="Stepper (wizard)" [needs]="['stepper']"></app-ds-demo>
  <app-ds-demo label="Tree" [needs]="['tree']">
    <ui-tree
      label="Cây nội dung"
      [nodes]="contentTree"
      [trailing]="status"
      [expanded]="store.expanded$()"
      (expandedChange)="store.setExpanded($event)"
      [selected]="store.selectedNode$()"
      (selectedChange)="store.setSelectedNode($event)"
    />
    <ng-template #status let-node>
      @if (node.data; as data) {
      <span uiBadge [tone]="data.tone">{{ data.label }}</span>
      }
    </ng-template>
  </app-ds-demo>
  <app-ds-demo
    label="Sắp xếp: kéo thả + nút ↑↓ cho bàn phím"
    [needs]="['feature-misc','icon-button']"
  ></app-ds-demo>
</app-ds-section>
