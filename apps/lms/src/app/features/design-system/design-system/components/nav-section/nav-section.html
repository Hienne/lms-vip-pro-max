<app-ds-section section="nav" title="Điều hướng">
  <app-ds-demo label="Breadcrumb" [needs]="['breadcrumb']">
    <ui-breadcrumb [items]="trail" />
  </app-ds-demo>
  <app-ds-demo label="Page header" [needs]="['page-header']">
    <ui-page-header
      title="Nền tảng nghiệp vụ Core Banking"
      description="Lộ trình nền tảng cho nhân sự mới của Ban QL&PT Core Banking."
    >
      <ui-breadcrumb slot="breadcrumb" [items]="trail" />
      <button slot="actions" type="button" uiButton>Chia sẻ</button>
      <button slot="actions" type="button" uiButton variant="primary">
        Tiếp tục học
      </button>
    </ui-page-header>
  </app-ds-demo>
  <app-ds-demo label="Tabs (← → để chuyển)" [needs]="['tabs']">
    <ui-tabs
      label="Mục khóa học"
      [tabs]="tabItems"
      [selected]="store.tab$()"
      (selectedChange)="store.setTab($event)"
    >
      <div uiTabPanel="overview">
        <p class="nav-section__panel-text">
          Tổng quan: mô tả, mục tiêu và lộ trình.
        </p>
      </div>
      <div uiTabPanel="courses">
        <p class="nav-section__panel-text">Khóa học: danh sách 6 khóa học.</p>
      </div>
      <div uiTabPanel="exams">
        <p class="nav-section__panel-text">
          Bài thi: các bài kiểm tra của chương trình.
        </p>
      </div>
    </ui-tabs>
  </app-ds-demo>
  <app-ds-demo label="Segmented" [needs]="['segmented']">
    <div>
      <ui-segmented
        label="Kỳ"
        [options]="periods"
        [value]="store.period$()"
        (valueChange)="store.setPeriod($event)"
      />
    </div>
  </app-ds-demo>
  <app-ds-demo label="Stepper (wizard)" [needs]="['stepper']">
    <div class="stack">
      <ui-stepper
        label="Các bước tạo khóa học"
        [steps]="wizardSteps"
        [selectedIndex]="store.step$()"
        (selectedIndexChange)="store.setStep($event)"
      />
      <div class="row">
        <button
          type="button"
          uiButton
          [disabled]="store.step$() === 0"
          (click)="store.setStep(store.step$() - 1)"
        >
          Quay lại
        </button>
        <button
          type="button"
          uiButton
          variant="primary"
          [disabled]="store.step$() === wizardSteps.length - 1"
          (click)="store.setStep(store.step$() + 1)"
        >
          Tiếp theo
        </button>
      </div>
    </div>
  </app-ds-demo>
  <app-ds-demo label="Tree" [needs]="['tree']">
    <ui-tree
      label="Cây nội dung"
      [nodes]="contentTree"
      [trailing]="status"
      [expanded]="store.expanded$()"
      (expandedChange)="store.setExpanded($event)"
      [selected]="store.selectedNode$()"
      (selectedChange)="store.setSelectedNode($event)"
    />
    <ng-template #status let-node>
      @if (node.data; as data) {
      <span uiBadge [tone]="data.tone">{{ data.label }}</span>
      }
    </ng-template>
  </app-ds-demo>
  <app-ds-demo
    label="Sắp xếp: kéo thả + nút ↑↓ cho bàn phím"
    [needs]="['sortable','icon-button']"
  >
    <div
      uiSortableList
      label="Bài học của chương"
      (moved)="store.moveLesson($event)"
    >
      @for (lesson of store.lessons$(); track lesson.id) {
      <ui-sortable-item [label]="lesson.title">
        <div class="nav-section__lesson-title">{{ lesson.title }}</div>
        <div class="nav-section__lesson-meta">{{ lesson.meta }}</div>
      </ui-sortable-item>
      }
    </div>
  </app-ds-demo>
</app-ds-section>
