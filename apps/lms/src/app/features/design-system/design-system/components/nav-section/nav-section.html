<app-ds-section section="nav" title="Điều hướng">
  <app-ds-demo label="Breadcrumb" [needs]="['breadcrumb']">
    <ui-breadcrumb [items]="trail" />
  </app-ds-demo>
  <app-ds-demo label="Page header" [needs]="['page-header']">
    <ui-page-header
      eyebrow="Khóa học"
      title="Nền tảng nghiệp vụ Core Banking"
      description="Lộ trình nền tảng cho nhân sự mới của Ban QL&PT Core Banking."
    >
      <ui-breadcrumb slot="breadcrumb" [items]="trail" />
      <button slot="actions" type="button" uiButton>Chia sẻ</button>
      <button slot="actions" type="button" uiButton variant="primary">
        Tiếp tục học
      </button>
    </ui-page-header>
  </app-ds-demo>
  <app-ds-demo label="Tabs (← → để chuyển)" [needs]="['tabs']"></app-ds-demo>
  <app-ds-demo label="Segmented" [needs]="['segmented']">
    <div>
      <ui-segmented
        label="Kỳ"
        [options]="periods"
        [value]="store.period$()"
        (valueChange)="store.setPeriod($event)"
      />
    </div>
  </app-ds-demo>
  <app-ds-demo label="Stepper (wizard)" [needs]="['stepper']">
    <div class="flex flex-col gap-4">
      <ui-stepper
        label="Các bước tạo khóa học"
        [steps]="wizardSteps"
        [selectedIndex]="store.step$()"
        (selectedIndexChange)="store.setStep($event)"
      />
      <div class="flex gap-3">
        <button
          type="button"
          uiButton
          [disabled]="store.step$() === 0"
          (click)="store.setStep(store.step$() - 1)"
        >
          Quay lại
        </button>
        <button
          type="button"
          uiButton
          variant="primary"
          [disabled]="store.step$() === wizardSteps.length - 1"
          (click)="store.setStep(store.step$() + 1)"
        >
          Tiếp theo
        </button>
      </div>
    </div>
  </app-ds-demo>
  <app-ds-demo label="Tree" [needs]="['tree']"></app-ds-demo>
  <app-ds-demo
    label="Sắp xếp: kéo thả + nút ↑↓ cho bàn phím"
    [needs]="['feature-misc','icon-button']"
  ></app-ds-demo>
</app-ds-section>
