<app-ds-section section="feedback" title="Phản hồi hệ thống">
  <app-ds-demo label="Alert" [needs]="['alert-tip']"></app-ds-demo>
  <app-ds-demo label="Toast (bấm để thử)" [needs]="['toast']">
    <div class="flex flex-wrap items-center gap-3">
      <button uiButton variant="ghost" (click)="toastSuccess()">
        Toast thành công
      </button>
      <button uiButton variant="ghost" (click)="toastError()">Toast lỗi</button>
      <button uiButton variant="ghost" (click)="toastWarning()">
        Toast cảnh báo
      </button>
      <button uiButton variant="ghost" (click)="toastInfo()">
        Toast thông tin
      </button>
    </div>
    <p class="mt-3 text-xs text-text-muted">
      Toast tự tắt sau vài giây (dừng khi rê chuột hoặc focus); toast lỗi ở lại
      đến khi đóng. Mọi toast đều được đọc cho trình đọc màn hình.
    </p>
  </app-ds-demo>
  <app-ds-demo
    label="Hộp xác nhận (bấm để thử)"
    [needs]="['modal']"
  ></app-ds-demo>
  <app-ds-demo label="Drawer (bấm để thử)" [needs]="['drawer']"></app-ds-demo>
  <app-ds-demo label="Menu (bấm để thử)" [needs]="['menu']"></app-ds-demo>
  <app-ds-demo
    label="Trạng thái rỗng, lỗi, không đủ quyền"
    [needs]="['empty-error-state']"
  ></app-ds-demo>
  <app-ds-demo
    label="Trạng thái đang tải: skeleton giữ chỗ bố cục (không giật layout)"
    [needs]="['skeleton-spinner']"
  >
    <div
      class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3"
      aria-busy="true"
    >
      <div>
        <div uiSkeleton variant="title" class="mb-2"></div>
        <div uiSkeleton></div>
        <div uiSkeleton class="skeleton-short"></div>
      </div>
      <div uiSkeleton variant="block"></div>
      <div class="flex flex-wrap items-center gap-3">
        <div uiSpinner></div>
        <span class="text-sm text-text-muted">Đang tải…</span>
      </div>
    </div>
  </app-ds-demo>
</app-ds-section>
