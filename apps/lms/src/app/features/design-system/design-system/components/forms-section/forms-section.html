<app-ds-section section="forms" title="Form &amp; nhập liệu">
  <div class="grid-2">
    <div class="stack">
      <app-ds-demo
        label="Field: nhãn luôn hiển thị · lỗi dưới trường (aria-describedby) · error summary có link"
        [needs]="['field', 'text-controls', 'button']"
      >
        <form class="stack" novalidate (submit)="$event.preventDefault()">
          @if (store.summaryShown$() && summaryItems().length > 0) {
          <ui-error-summary [items]="summaryItems()" />
          }
          <ui-field
            label="Tên khóa học"
            required
            hint="Tối đa 120 ký tự."
            [errors]="titleErrors()"
          >
            <input
              uiInput
              id="ds-title"
              placeholder="Ví dụ: Quy trình đối soát"
              [formField]="demoForm.title"
            />
          </ui-field>
          <ui-field label="Email" required [errors]="emailErrors()">
            <input
              uiInput
              id="ds-email"
              type="email"
              [formField]="demoForm.email"
            />
          </ui-field>
          <ui-field label="Chương trình">
            <select uiSelect [formField]="demoForm.program">
              <option value="">— Chọn —</option>
              <option value="1">Nền tảng nghiệp vụ Core Banking</option>
            </select>
          </ui-field>
          <ui-field label="Mô tả">
            <textarea
              uiTextarea
              rows="2"
              [formField]="demoForm.description"
            ></textarea>
          </ui-field>
          <ui-field label="Chỉ đọc">
            <input uiInput readonly value="Ban QL&amp;PT Core Banking" />
          </ui-field>
          <div class="row row--gap-2">
            <button
              uiButton
              variant="primary"
              type="button"
              (click)="validate()"
            >
              Thử validate
            </button>
            <button
              uiButton
              variant="ghost"
              type="button"
              (click)="clearErrors()"
            >
              Xóa lỗi
            </button>
          </div>
        </form>
      </app-ds-demo>

      <app-ds-demo
        label="Ô nhập · chọn · vùng văn bản"
        [needs]="['text-controls']"
      >
        <div class="forms-section__fields">
          <label class="forms-section__field">
            Tên khóa học
            <input uiInput name="ds1" placeholder="Ví dụ: Quy trình đối soát" />
          </label>
          <label class="forms-section__field">
            Nhỏ
            <input
              uiInput
              size="sm"
              name="ds-small"
              placeholder="Tìm theo mã"
            />
          </label>
          <label class="forms-section__field">
            Email (không hợp lệ)
            <input
              uiInput
              type="email"
              name="ds2"
              value="sai-dinh-dang"
              aria-invalid="true"
            />
          </label>
          <label class="forms-section__field">
            Vô hiệu
            <input
              uiInput
              name="ds-disabled"
              value="Không chỉnh sửa được"
              disabled
            />
          </label>
          <label class="forms-section__field">
            Chỉ đọc
            <input
              uiInput
              name="ds5"
              value="Ban QL&amp;PT Core Banking"
              readonly
            />
          </label>
          <label class="forms-section__field">
            Chương trình
            <select uiSelect name="ds3">
              <option value="">— Chọn —</option>
              <option value="1">Nền tảng nghiệp vụ Core Banking</option>
            </select>
          </label>
          <label class="forms-section__field">
            Chương trình (nhỏ)
            <select uiSelect size="sm" name="ds-select-small">
              <option value="">— Chọn —</option>
              <option value="1">Nền tảng nghiệp vụ Core Banking</option>
            </select>
          </label>
          <label class="forms-section__field">
            Mô tả
            <textarea uiTextarea name="ds4" rows="2"></textarea>
          </label>
        </div>
      </app-ds-demo>
    </div>

    <div class="stack">
      <app-ds-demo label="Checkbox · switch" [needs]="['check-switch']">
        <div class="stack stack--gap-3">
          <label class="forms-section__option"
            ><input type="checkbox" uiCheckbox checked /> Trộn thứ tự câu
            hỏi</label
          >
          <label class="forms-section__option"
            ><input type="checkbox" uiCheckbox /> Trộn đáp án</label
          >
          <label class="forms-section__option"
            ><input type="checkbox" uiCheckbox disabled /> Không thể chọn</label
          >
          <label class="forms-section__toggle"
            ><input type="checkbox" uiSwitch checked /> Nhắc học trước
            hạn</label
          >
          <label class="forms-section__toggle"
            ><input type="checkbox" uiSwitch /> Gửi bản tin hằng tuần</label
          >
        </div>
      </app-ds-demo>

      <app-ds-demo label="Option card" [needs]="['option-card']">
        <div class="stack stack--gap-3">
          <ui-option-card
            title="Bắt buộc"
            description="Option card — radio lớn, dễ chạm"
          >
            <input type="radio" name="ds-kind" checked />
          </ui-option-card>
          <ui-option-card title="Tự chọn">
            <input type="radio" name="ds-kind" />
          </ui-option-card>
          <ui-option-card title="Kiểm tra giao dịch treo" letter="A">
            <input type="checkbox" checked />
          </ui-option-card>
          <ui-option-card title="Không khả dụng" [description]="'Đã hết lượt'">
            <input type="checkbox" disabled />
          </ui-option-card>
          <ui-option-card title="Đối soát cuối ngày" tone="correct" chosen />
          <ui-option-card title="Chạy lại EOD" tone="wrong" chosen />
          <ui-option-card title="Bỏ qua cảnh báo" tone="neutral" />
        </div>
      </app-ds-demo>
      <app-ds-demo
        label="Dropzone &amp; trạng thái upload"
        [needs]="['dropzone', 'icon']"
      >
        <div class="stack stack--gap-3">
          <label uiDropzone accept=".pdf" (files)="store.addFiles($event)">
            <ui-icon name="upload" size="xl" />
            <div class="forms-section__drop-title">
              Kéo thả hoặc
              <span class="forms-section__drop-link">chọn tệp</span>
            </div>
            <div class="forms-section__drop-hint">PDF · tối đa 20 MB</div>
            <input type="file" hidden />
          </label>
          <p class="forms-section__status" aria-live="polite">
            Đã nhận: {{ store.receivedFiles$() || '(chưa có tệp)' }}
          </p>
          <ui-upload-item
            name="so-tay-su-co-eod.pdf"
            state="uploading"
            [progress]="64"
          />
          <ui-upload-item name="quy-trinh-doi-soat.pdf" [size]="2621440" />
          <ui-upload-item name="bao-cao.exe" state="error" icon="file">
            Sai định dạng: chỉ chấp nhận PDF.
          </ui-upload-item>
        </div>
      </app-ds-demo>
      <app-ds-demo
        label="Tìm kiếm · bộ lọc · chip"
        [needs]="['search', 'text-controls', 'badge-chip']"
      >
        <div class="stack">
          <div class="row">
            <ui-search (searched)="store.setSearchQuery($event)" />
            <select
              uiSelect
              aria-label="Lĩnh vực"
              class="forms-section__select"
            >
              <option value="">Tất cả lĩnh vực</option>
              <option value="1">Nghiệp vụ</option>
            </select>
          </div>
          <p class="forms-section__status" aria-live="polite">
            Truy vấn gần nhất: {{ store.searchQuery$() || '(trống)' }}
          </p>
          <div class="row">
            <button uiChip [pressed]="true">Đang chọn</button>
            <button uiChip>Vận hành</button>
          </div>
        </div>
      </app-ds-demo>
    </div>
  </div>
</app-ds-section>
