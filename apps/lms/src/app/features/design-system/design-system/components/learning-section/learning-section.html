<app-ds-section section="learning" title="Thành phần học tập">
  <app-ds-demo
    label="Thẻ khóa học"
    [needs]="['domain-course-card']"
  ></app-ds-demo>
  <app-ds-demo
    label="Journey — bản đồ tuyến thay stepper (tên &amp; % luôn hiển thị)"
    [needs]="['domain-course-card']"
  ></app-ds-demo>
  <app-ds-demo label="Huy hiệu cánh mai" [needs]="['mai']">
    <ul class="grid list-none grid-cols-2 gap-3 md:grid-cols-4">
      @for (badge of badges; track badge.name) {
      <li class="flex justify-center">
        <ui-mai-badge
          [name]="badge.name"
          [description]="badge.description"
          [earned]="badge.earned"
        />
      </li>
      }
    </ul>
  </app-ds-demo>
  <app-ds-demo
    label="Đánh giá sao · hỏi đáp"
    [needs]="['rating','feature-misc','avatar']"
  ></app-ds-demo>
  <app-ds-demo
    label="Thi: đồng hồ (đỏ khi ≤ 60s) · lưới câu"
    [needs]="['timer','question-grid']"
  >
    <div class="flex flex-col gap-4">
      <div class="flex flex-wrap items-center gap-3">
        <ui-timer [seconds]="768" />
        <ui-timer [seconds]="45" />
      </div>
      <div class="max-w-[260px]">
        <app-question-grid
          [cells]="quiz.cells$()"
          [current]="quiz.current$()"
          (goto)="quiz.goto($event)"
        />
      </div>
      <app-question-legend />
    </div>
  </app-ds-demo>
  <app-ds-demo
    label="Trợ lý AI — luôn kèm trích dẫn nguồn"
    [needs]="['feature-assistant','avatar']"
  ></app-ds-demo>
</app-ds-section>
