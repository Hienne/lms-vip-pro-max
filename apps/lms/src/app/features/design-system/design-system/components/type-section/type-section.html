<app-ds-section
  section="type"
  title="Typography"
  description='Be Vietnam Pro — thiết kế cho tiếng Việt (dấu chồng rõ). Skill gợi ý cặp "Financial Trust"; giữ Be Vietnam Pro vì hỗ trợ tiếng Việt tốt hơn. Body tối thiểu 16px, line-height 1.5.'
>
  <div uiCard padded class="type-section__card">
    @for (sample of samples; track sample.label) {
    <div class="sample">
      <span class="type-section__label">{{ sample.label }}</span>
      <span [class]="sample.modifier">{{ sample.text }}</span>
    </div>
    }
    <div class="sample">
      <span class="type-section__label">Số liệu · tabular</span>
      <span class="type-section__figures">92% · 8,5 · +150 · 1.250</span>
    </div>
  </div>
</app-ds-section>
