<app-ds-section section="data" title="Hiển thị dữ liệu">
  <app-ds-demo label="KPI" [needs]="['kpi']">
    <div class="data-section__kpis">
      <ui-kpi
        icon="book-open"
        [value]="6"
        label="Khóa được giao"
        delta="4 bắt buộc · 1 quá hạn"
      />
      <ui-kpi
        icon="clipboard-check"
        tone="info"
        [value]="78"
        suffix="%"
        label="Điểm gần nhất"
      />
      <ui-kpi
        icon="triangle-alert"
        tone="danger"
        [value]="3"
        label="Quá hạn"
        href="/design-system"
      />
      <ui-kpi icon="trophy" tone="reward" value="1.250" label="Điểm thưởng" />
    </div>
  </app-ds-demo>

  <div class="grid-3">
    <app-ds-demo label="Progress bar" [needs]="['progress-ring']">
      <div class="stack stack--gap-3">
        <ui-progress [value]="68" />
        <ui-progress [value]="100" tone="success" />
        <ui-progress [value]="30" tone="warning" />
        <ui-progress [value]="12" tone="danger" size="sm" />
        <ui-progress [value]="45" tone="reward" label="Điểm thưởng" />
      </div>
    </app-ds-demo>

    <app-ds-demo label="Progress ring" [needs]="['progress-ring']">
      <div class="row row--gap-6">
        <ui-ring [value]="68" />
        <ui-ring [value]="100" />
      </div>
      <p class="data-section__note">Ring đạt 100% nở thành cánh mai vàng.</p>
    </app-ds-demo>

    <app-ds-demo label="List" [needs]="['icon', 'card', 'list']">
      <div uiCard class="data-section__list">
        <ul uiList>
          @for (item of listItems; track item.title) {
          <li>
            <a uiListItem [routerLink]="[]" fragment="ds-data">
              <span uiListIcon><ui-icon [name]="item.icon" size="sm" /></span>
              <span class="data-section__item-title">{{ item.title }}</span>
              <ui-icon name="chevron-right" size="sm" />
            </a>
          </li>
          }
        </ul>
      </div>
    </app-ds-demo>
  </div>

  <app-ds-demo
    label="Bảng: native table trong card, responsive dưới 720px"
    [needs]="['table', 'progress-ring', 'card', 'badge-chip']"
  >
    <section uiCard>
      <div uiTableWrap>
        <table uiTable responsive>
          <caption class="sr-only">
            Bảng mẫu
          </caption>
          <thead>
            <tr>
              <th scope="col">Mã</th>
              <th scope="col">Khóa học</th>
              <th scope="col">Tiến độ</th>
              <th scope="col">Trạng thái</th>
            </tr>
          </thead>
          <tbody>
            @for (row of rows; track row.code) {
            <tr>
              <td data-label="Mã">
                <span class="data-section__code">{{ row.code }}</span>
              </td>
              <td data-label="Khóa học" class="data-section__course">
                {{ row.title }}
              </td>
              <td data-label="Tiến độ">
                <div class="progress-cell">
                  <ui-progress
                    class="progress-cell__bar"
                    size="sm"
                    [value]="row.pct"
                    [label]="'Tiến độ ' + row.title"
                  />
                  <span class="progress-cell__pct">{{ row.pct }}%</span>
                </div>
              </td>
              <td data-label="Trạng thái">
                <span uiBadge dot [tone]="row.tone" [outline]="row.outline"
                  >{{ row.status }}</span
                >
              </td>
            </tr>
            }
          </tbody>
        </table>
      </div>
    </section>
  </app-ds-demo>

  <app-ds-demo
    label="Bảng dữ liệu: sắp xếp theo cột (aria-sort) · chọn nhiều · phân trang"
    [needs]="['data-table']"
  ></app-ds-demo>

  <app-ds-demo label="Avatar: kích cỡ · nhóm chồng nhau" [needs]="['avatar']">
    <div class="row row--gap-6">
      <div class="row">
        <ui-avatar [name]="people[0]" size="sm" />
        <ui-avatar [name]="people[0]" />
        <ui-avatar [name]="people[0]" size="lg" />
        <ui-avatar [name]="people[0]" size="xl" />
      </div>
      <ui-avatar [name]="people[1]" top />
      <div uiAvatarGroup aria-label="Nhóm Tổng hợp &amp; QA">
        @for (person of people; track person) {
        <ui-avatar [name]="person" />
        }
      </div>
    </div>
  </app-ds-demo>
</app-ds-section>
