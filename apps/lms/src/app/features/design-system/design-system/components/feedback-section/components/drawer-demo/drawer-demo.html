<div class="row">
  <button uiButton (click)="store.open('end')">
    <ui-icon name="layers" size="sm" /> Mở drawer
  </button>
  <button uiButton variant="ghost" (click)="store.open('start')">
    <ui-icon name="layers" size="sm" /> Drawer bên trái
  </button>
  <button uiButton variant="ghost" (click)="store.open('dialog')">
    Hộp thoại ngắn
  </button>
</div>
<p class="drawer-demo__note">
  Bẫy focus, Esc để đóng, trả focus về nút mở. Toàn chiều rộng trên màn hình
  hẹp.
</p>

<ng-template
  [uiDrawer]="store.openSide$() !== null"
  [uiDrawerSide]="store.side$()"
  [uiDrawerVariant]="store.variant$()"
  uiDrawerTitle="Drawer mẫu"
  [uiDrawerFooter]="footer"
  (uiDrawerDismiss)="store.close()"
>
  <p class="drawer-demo__body">
    Dùng cho form chỉnh sửa nhanh mà không rời trang danh sách.
  </p>
</ng-template>
<ng-template #footer let-close="close">
  <button uiButton variant="primary" cdkFocusInitial (click)="close()">
    Đóng
  </button>
</ng-template>
