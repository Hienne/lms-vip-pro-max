<form id="unit-form" class="stack" novalidate (submit)="onSubmit($event)">
  <ui-field label="Mã đơn vị" required [errors]="codeErrors()">
    <input uiInput [formField]="unitForm.code" />
  </ui-field>
  <ui-field label="Tên đơn vị" required [errors]="nameErrors()">
    <input uiInput [formField]="unitForm.name" />
  </ui-field>
</form>
