<ng-template
  [uiDrawer]="store.editing$() !== null"
  [uiDrawerTitle]="store.editorTitle$()"
  [uiDrawerFooter]="footer"
  [uiDrawerBusy]="store.isSaving$()"
  uiDrawerBusyLabel="Đang lưu…"
  (uiDrawerDismiss)="store.cancelEdit()"
>
  @let editing = store.editing$(); @if (store.lookupError$(); as error) {
  <ui-alert tone="danger">{{ error.message }}</ui-alert>
  } @else if (editing && store.lookupsReady$()) {
  <app-user-form [user]="editing.user" />
  } @else {
  <span uiSpinner></span>
  }
</ng-template>

<ng-template #footer let-close="close">
  <ui-form-actions
    formId="user-form"
    submitLabel="Lưu"
    cancelLabel="Hủy"
    [saving]="store.isSaving$() || !store.lookupsReady$()"
    (cancel)="close()"
  />
</ng-template>
