<ng-template
  [uiDrawer]="store.editing$() !== null"
  [uiDrawerTitle]="store.editorTitle$()"
  [uiDrawerFooter]="footer"
  [uiDrawerBusy]="store.isSaving$()"
  uiDrawerBusyLabel="Đang lưu…"
  (uiDrawerDismiss)="store.cancelEdit()"
>
  @let meta = store.meta$(); @let me = store.me$(); @let editing =
  store.editing$(); @if (meta && me && editing) {
  <app-user-form
    [user]="editing.user"
    [meta]="meta"
    [me]="me"
    (submitted)="store.save($event)"
  />
  } @else if (store.metaError$(); as error) {
  <ui-alert tone="danger">{{ error.message }}</ui-alert>
  } @else {
  <span uiSpinner></span>
  }
</ng-template>

<ng-template #footer let-close="close">
  <ui-form-actions
    formId="user-form"
    submitLabel="Lưu"
    cancelLabel="Hủy"
    [saving]="store.isSaving$() || !store.meta$()"
    (cancel)="close()"
  >
    @if (store.editing$()?.user; as user) {
    <button
      uiButton
      variant="ghost"
      class="user-editor__reset"
      [disabled]="store.isResetting$()"
      (click)="store.resetPassword(user)"
    >
      <ui-icon name="key" size="sm" />Đặt lại mật khẩu
    </button>
    }
  </ui-form-actions>
</ng-template>
