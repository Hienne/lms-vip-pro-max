<form class="password-form" [formRoot]="passwordForm">
  <ui-field label="Mật khẩu hiện tại" required>
    <input
      uiInput
      type="password"
      autocomplete="current-password"
      [formField]="passwordForm.currentPassword"
    />
  </ui-field>
  <ui-field label="Mật khẩu mới" required [hint]="rules">
    <input
      uiInput
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.newPassword"
    />
  </ui-field>
  <ui-field label="Nhập lại mật khẩu mới" required>
    <input
      uiInput
      type="password"
      autocomplete="new-password"
      [formField]="passwordForm.confirm"
    />
  </ui-field>
  <div class="password-form__actions">
    <button uiButton variant="primary" type="submit" [busy]="busy()">
      Đổi mật khẩu
    </button>
  </div>
</form>
