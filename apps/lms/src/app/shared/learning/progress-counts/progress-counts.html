<ui-stat-strip aria-label="Số khóa học">
  @for (item of items(); track item.label) { @if (interactive()) {
  <ui-stat
    [label]="item.label"
    [value]="item.value"
    [tone]="item.danger ? 'danger' : 'default'"
    [attr.title]="item.hint"
    [pressed]="selectedFilter() === item.filter"
    (press)="filterSelected.emit(item.filter)"
  />
  } @else {
  <ui-stat
    [label]="item.label"
    [value]="item.value"
    [tone]="item.danger ? 'danger' : 'default'"
    [attr.title]="item.hint"
  />
  } } @let average = averageScore(); @if (average !== undefined) {
  <ui-stat
    label="Điểm thi trung bình"
    [value]="average === null ? '—' : (average | fmtPct: 2)"
  />
  }
</ui-stat-strip>
