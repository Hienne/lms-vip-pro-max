<button
  uiBadge
  outline
  type="button"
  class="source"
  [attr.aria-label]="name()"
  [uiPopover]="details"
  [popoverLabel]="name()"
>
  {{ citation().n }}
</button>
<ng-template #details>
  <p class="source__file">{{ citation().fileName }}</p>
  @if (citation().sectionPath) {
  <p class="source__section">{{ citation().sectionPath }}</p>
  }
  <p class="source__where">{{ location() }}</p>
  <p class="source__quote">{{ citation().snippet }}</p>
  @if (citation().lesson; as lesson) {
  <a class="source__open" [routerLink]="lesson.url">Mở bài học</a>
  }
</ng-template>
