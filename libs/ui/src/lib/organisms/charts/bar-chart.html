@let plot = geometry();
<figure class="chart-view">
  <div class="chart-view__plot" [class.chart-view__plot--compact]="compact()">
    <svg
      class="chart-view__svg"
      [attr.viewBox]="'0 0 ' + plot.width + ' ' + plot.height"
      [attr.preserveAspectRatio]="compact() ? 'none' : null"
      role="img"
      [attr.aria-label]="label()"
    >
      <line
        class="chart-view__grid"
        x1="24"
        [attr.x2]="plot.width - 24"
        [attr.y1]="plot.baseline"
        [attr.y2]="plot.baseline"
      />
      @for (bar of bars(); track $index) {
      <rect
        class="chart-view__bar"
        [class.chart-view__bar--last]="bar.last"
        [attr.x]="bar.x"
        [attr.y]="bar.y"
        [attr.width]="bar.width"
        [attr.height]="bar.height"
        rx="4"
      >
        <title>{{bar.label}}: {{bar.value}}{{unit()}}</title>
      </rect>
      @if (!compact()) {
      <text
        class="chart-view__label"
        [attr.x]="bar.center"
        [attr.y]="bar.y - 8"
        text-anchor="middle"
      >
        {{bar.value}}
      </text>
      <text
        class="chart-view__label"
        [attr.x]="bar.center"
        y="180"
        text-anchor="middle"
      >
        {{bar.label}}
      </text>
      } }
    </svg>
    @if (compact()) { @for (bar of bars(); track $index) { @if (bar.value > 0) {
    <span
      class="chart-view__compact-value"
      aria-hidden="true"
      [style.left.%]="100 * bar.center / plot.width"
      [style.top.%]="100 * bar.y / plot.height"
      >{{ bar.value }}</span
    >
    } } }
  </div>
  @if (compact()) {
  <div class="chart-view__compact-axis" aria-hidden="true">
    @for (bar of bars(); track $index) { @if (bar.showLabel) {
    <span [style.left.%]="100 * bar.center / plot.width">{{ bar.label }}</span>
    } }
  </div>
  }
  <figcaption class="sr-only">
    @for (item of data(); track $index) { {{item.label}}:
    {{item.value}}{{unit()}}; }
  </figcaption>
</figure>
