<figure class="chart-view chart-view--donut">
  <svg
    class="chart-view__donut"
    viewBox="0 0 160 160"
    role="img"
    [attr.aria-label]="label()"
  >
    <circle class="chart-view__base" cx="80" cy="80" r="62" pathLength="100" />
    @for (part of segments(); track $index) {
    <circle
      class="chart-view__segment"
      [class]="part.css"
      cx="80"
      cy="80"
      r="62"
      pathLength="100"
      [attr.stroke-dasharray]="part.length + ' ' + (100-part.length)"
      [attr.stroke-dashoffset]="part.offset"
    >
      <title>{{part.label}}: {{part.value}}</title>
    </circle>
    }
  </svg>
  <figcaption class="chart-view__parts">
    @for (part of segments(); track $index) {
    <div class="chart-view__part">
      <i class="chart-view__swatch" [class]="part.css"></i
      ><span>{{part.label}}</span><strong>{{part.value}}</strong
      ><span>({{part.percent}}%)</span>
    </div>
    }
  </figcaption>
</figure>
