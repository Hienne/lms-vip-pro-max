<header class="drawer__header">
  <h2 class="drawer__title" [id]="data.titleId">{{ data.title() }}</h2>
  <button uiIconButton label="Đóng" [disabled]="data.busy()" (click)="close()">
    <ui-icon name="x" />
  </button>
</header>
<div class="drawer__main">
  <div class="drawer__body">
    <ng-container
      [ngTemplateOutlet]="data.body"
      [ngTemplateOutletContext]="context"
    />
  </div>
  @if (data.footer(); as footer) {
  <footer class="drawer__footer">
    <ng-container
      [ngTemplateOutlet]="footer"
      [ngTemplateOutletContext]="context"
    />
  </footer>
  } @if (data.busy()) {
  <div class="drawer__busy" role="status">
    <span class="spinner" aria-hidden="true"></span>
    <span>{{ data.busyLabel() }}</span>
  </div>
  }
</div>
