<div class="dialog__header">
  <div class="dialog__icon" [class]="'dialog__icon--' + data.tone">
    <ui-icon [name]="icon()" />
  </div>
  <h2 class="dialog__title" [id]="data.titleId">{{ data.title }}</h2>
  <button uiIconButton label="Đóng hộp thoại" (click)="close(false)">
    <ui-icon name="x" />
  </button>
</div>
<p class="dialog__body" [id]="data.messageId">{{ data.message }}</p>
<div class="dialog__footer">
  <button uiButton variant="ghost" (click)="close(false)">
    {{ data.cancelLabel }}
  </button>
  <button
    uiButton
    cdkFocusInitial
    [variant]="danger() ? 'danger' : 'primary'"
    (click)="close(true)"
  >
    {{ data.confirmLabel }}
  </button>
</div>
