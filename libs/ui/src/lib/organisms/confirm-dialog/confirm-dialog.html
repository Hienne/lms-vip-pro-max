<div class="dialog__header">
  <h2 class="dialog__title" [id]="data.titleId">{{ data.title }}</h2>
  <button
    uiIconButton
    label="Đóng hộp thoại"
    (click)="close(data.distinctClose ? undefined : false)"
  >
    <ui-icon name="x" />
  </button>
</div>
<p class="dialog__body" [id]="data.messageId">{{ data.message }}</p>
@if (data.acknowledge) {
<label class="dialog__acknowledge">
  <input
    type="checkbox"
    uiCheckbox
    [checked]="acknowledged()"
    (change)="tick($event)"
  />
  <span>{{ data.acknowledge }}</span>
</label>
}
<div class="dialog__footer">
  <button uiButton variant="ghost" (click)="close(false)">
    {{ data.cancelLabel }}
  </button>
  <button
    uiButton
    cdkFocusInitial
    [disabled]="!canConfirm()"
    [variant]="danger() ? 'danger' : 'primary'"
    (click)="close(true)"
  >
    {{ data.confirmLabel }}
  </button>
</div>
