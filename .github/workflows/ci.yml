name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # nx-set-shas reads previous workflow runs

# Only PR runs are cancelled: cancelling a main run mid-deploy would leave the
# live frontend half-copied.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_NO_CLOUD: true
  IMAGE: ghcr.io/hienne/lms-vip-pro-max
  # Set to 'false' to restore the Prettier gate. Unit tests do not run in CI.
  SKIP_FORMAT_CHECK: 'true'

jobs:
  check:
    name: Check affected projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # nx affected compares against the base commit
          filter: blob:none # full commit history, file contents fetched on demand
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sets NX_BASE / NX_HEAD: PR base, or the last successful run on main.
      - uses: nrwl/nx-set-shas@v5

      - uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Check formatting
        if: ${{ env.SKIP_FORMAT_CHECK != 'true' }}
        run: npm run format:check

      - name: Check affected projects (lint, typecheck, build, bundle guard)
        run: npm run ci:check

  # Runs alongside `check`: the image build is self-contained (own npm ci and
  # build), and nothing is deployed until `deploy` sees both jobs green.
  image:
    name: Build frontend artifact image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # The npm ci layer is reused across runs while the lockfile is unchanged.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      # Published by digest so the server deploys exactly the bytes built here.
      - name: Publish immutable image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          digest=$(docker image inspect "$IMAGE:$GITHUB_SHA" --format '{{index .RepoDigests 0}}')
          [[ "$digest" =~ ^${IMAGE}@sha256:[a-f0-9]{64}$ ]]
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy frontend to Ubuntu
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      # The key's forced command on the server ignores the remote command; the
      # deploy script reads exactly three stdin lines: image, actor, token.
      - name: Deploy via restricted SSH
        env:
          SSH_KEY: ${{ secrets.UBUNTU_FE_DEPLOY_SSH_KEY }}
          DEPLOY_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$DEPLOY_IMAGE"
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          chmod 600 "$key" "$hosts"
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' '[103.121.90.119]:26266 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJA8LCy2wLBVZ6P1ROY45TDec9V29JO8JKa2z3D+HIGU' > "$hosts"
          printf '%s\n%s\n%s\n' "$DEPLOY_IMAGE" "$GITHUB_ACTOR" "$REGISTRY_TOKEN" |
            ssh -T -i "$key" -p 26266 \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
              -o ConnectTimeout=20 dev_user@103.121.90.119 deploy-fe

      - name: Verify public frontend revision
        run: |
          set -euo pipefail
          revision=$(curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            "http://103.121.90.119/version.txt?commit=$GITHUB_SHA")
          test "$revision" = "$GITHUB_SHA"
          curl --fail --silent --show-error --output /dev/null http://103.121.90.119/
          # Web workers must be served as JavaScript or the browser refuses to start them.
          workers=$(curl --fail --silent --show-error --retry 3 --retry-delay 3 \
            "http://103.121.90.119/workers.txt?commit=$GITHUB_SHA")
          test -n "$workers"
          while read -r worker; do
            headers=$(curl --fail --silent --show-error --head "http://103.121.90.119/$worker")
            echo "$headers" | head -1 | grep -q ' 200'
            echo "$headers" | grep -i '^content-type:' | grep -qi 'javascript'
          done <<< "$workers"
